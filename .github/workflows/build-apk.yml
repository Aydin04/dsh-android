name: Build Android APK (Full On-Device DSH Bundle)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and Bundle Full Engine (Node.js ARM64 and DSH Core)
        run: |
          mkdir -p app/src/main/assets/engine
          
          echo "1. Fetching Node.js v22 ARM64 binary..."
          curl -sL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-arm64.tar.xz -o /tmp/node-arm64.tar.xz
          tar -xf /tmp/node-arm64.tar.xz -C /tmp
          cp /tmp/node-v22.14.0-linux-arm64/bin/node app/src/main/assets/engine/node
          chmod +x app/src/main/assets/engine/node
          
          echo "2. Installing and Packaging Full DeepSeek Harness Core..."
          NODE_OPTIONS="--max-old-space-size=4096" npm install -g @deepseek-ai/dsh --omit=dev --no-audit --no-fund --prefix /tmp/global_dsh
          
          tar -cf app/src/main/assets/engine/dsh-core.tar -C /tmp/global_dsh/lib/node_modules/@deepseek-ai dsh
          
          ls -lh app/src/main/assets/engine/
          if [ ! -f app/src/main/assets/engine/dsh-core.tar ]; then
            echo "ERROR: dsh-core.tar was not created!"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Check APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep assets/engine/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-full-standalone-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "DSH Mobile v1.2.2 (Standalone On-Device Engine & Auto Boot)"
          body: |
            ## 🚀 DSH Mobile Standalone Release v1.2.2
            - ⚡ **Auto Booting On-Device**: Menjalankan server DSH lokal di HP secara otomatis saat aplikasi dibuka
            - 📦 **Full DSH Engine + Node.js ARM64 Bundled (Uncompressed Tar)**
            - 🌐 **100% Official DeepSeek Harness Dashboard**
            - 🛡️ **Full Permissions**: All Files Access, Background Service, Voice, Vision
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
