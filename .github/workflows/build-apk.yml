name: Build Android APK (Full On-Device DSH Bundle)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Download and Bundle Optimized Native Node.js, Minimal Shared Libs, and Compressed DSH Core
        run: |
          rm -rf app/src/main/assets/engine
          mkdir -p app/src/main/assets/engine
          
          echo "1. Fetching Native Android Bionic Node.js and required shared libs..."
          mkdir -p /tmp/bionic_build && cd /tmp/bionic_build
          
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/n/nodejs-lts/nodejs-lts_24.18.0-1_aarch64.deb" -o node.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/z/zlib/zlib_1.3.2_aarch64.deb" -o zlib.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/c/c-ares/c-ares_1.34.8_aarch64.deb" -o cares.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/libs/libsqlite/libsqlite_3.53.4_aarch64.deb" -o sqlite.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/libi/libicu/libicu_78.3_aarch64.deb" -o icu.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/libc/libc++/libc++_29_aarch64.deb" -o libc++.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/o/openssl/openssl_1:3.6.3_aarch64.deb" -o openssl.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/r/ripgrep/ripgrep_15.2.0_aarch64.deb" -o ripgrep.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.92_aarch64.deb" -o proot.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.4.3_aarch64.deb" -o talloc.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb" -o shmem.deb
          
          for f in *.deb; do
            ar x "$f"
            tar -xf data.tar.*
          done
          
          cp data/data/com.termux/files/usr/bin/node $GITHUB_WORKSPACE/app/src/main/assets/engine/node
          patchelf --set-rpath '/data/user/0/com.aydin.dsh/files/lib:/data/data/com.aydin.dsh/files/lib' $GITHUB_WORKSPACE/app/src/main/assets/engine/node
          chmod 755 $GITHUB_WORKSPACE/app/src/main/assets/engine/node

          if [ -f "data/data/com.termux/files/usr/bin/rg" ]; then
            cp data/data/com.termux/files/usr/bin/rg $GITHUB_WORKSPACE/app/src/main/assets/engine/rg
            patchelf --set-rpath '/data/user/0/com.aydin.dsh/files/lib:/data/data/com.aydin.dsh/files/lib' $GITHUB_WORKSPACE/app/src/main/assets/engine/rg 2>/dev/null || true
            chmod 755 $GITHUB_WORKSPACE/app/src/main/assets/engine/rg
          fi

          if [ -f "data/data/com.termux/files/usr/bin/proot" ]; then
            cp data/data/com.termux/files/usr/bin/proot $GITHUB_WORKSPACE/app/src/main/assets/engine/proot
            patchelf --set-rpath '/data/user/0/com.aydin.dsh/files/lib:/data/data/com.aydin.dsh/files/lib' $GITHUB_WORKSPACE/app/src/main/assets/engine/proot 2>/dev/null || true
            chmod 755 $GITHUB_WORKSPACE/app/src/main/assets/engine/proot
          fi

          # Fetch official minimal Alpine Linux rootfs (~3.5MB)
          curl -sL "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.0-aarch64.tar.gz" -o $GITHUB_WORKSPACE/app/src/main/assets/engine/alpine-rootfs.tar.gz || true
          
          # Package strictly needed shared libraries with gzip compression
          mkdir -p /tmp/libs_to_pack
          for lib in libc++_shared.so libcares.so libcrypto.so.3 libssl.so.3 libz.so.1.3.2 libsqlite3.so.3.53.4 libicui18n.so.78.3 libicuuc.so.78.3 libicudata.so.78.3 libtalloc.so.2 libandroid-shmem.so; do
            find data/data/com.termux/files/usr/lib -name "$lib*" -exec cp -L {} /tmp/libs_to_pack/ \;
          done
          cd /tmp/libs_to_pack
          [ -f libz.so.1.3.2 ] && cp libz.so.1.3.2 libz.so.1 && cp libz.so.1.3.2 libz.so
          [ -f libcrypto.so.3 ] && cp libcrypto.so.3 libcrypto.so
          [ -f libssl.so.3 ] && cp libssl.so.3 libssl.so
          [ -f libsqlite3.so.3.53.4 ] && cp libsqlite3.so.3.53.4 libsqlite3.so && cp libsqlite3.so.3.53.4 libsqlite3.so.0
          [ -f libicui18n.so.78.3 ] && cp libicui18n.so.78.3 libicui18n.so.78 && cp libicui18n.so.78.3 libicui18n.so
          [ -f libicuuc.so.78.3 ] && cp libicuuc.so.78.3 libicuuc.so.78 && cp libicuuc.so.78.3 libicuuc.so
          [ -f libicudata.so.78.3 ] && cp libicudata.so.78.3 libicudata.so.78 && cp libicudata.so.78.3 libicudata.so
          
          tar -czf $GITHUB_WORKSPACE/app/src/main/assets/engine/engine-libs.tar.gz .
          
          cd $GITHUB_WORKSPACE
          echo "2. Installing and Packaging Full DeepSeek Harness Core..."
          NODE_OPTIONS="--max-old-space-size=4096" npm install -g @deepseek-ai/dsh --omit=dev --no-audit --no-fund --prefix /tmp/global_dsh
          
          echo "3. Removing other platforms (win32, darwin, linux-x64) and dev artifacts..."
          # Set up android-arm64 for node-pty
          if [ -d "/tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty" ]; then
            mkdir -p /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/prebuilds/android-arm64
            cp -f /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/prebuilds/linux-arm64/pty.node \
               /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/prebuilds/android-arm64/pty.node 2>/dev/null || true
            cp -f $GITHUB_WORKSPACE/.github/scripts/node-pty-utils.js /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/lib/utils.js
          fi

          # Safe Koffi Android Adapter to prevent crash on Android
          if [ -d "/tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/koffi" ]; then
            cp -f $GITHUB_WORKSPACE/.github/scripts/koffi-adapter.js /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/koffi/src/koffi/index.js
          fi

          # Safe Cordis HMR Adapter to prevent --expose-internals crash on Android
          if [ -d "/tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/cordis-plugin-hmr" ]; then
            cp -f $GITHUB_WORKSPACE/.github/scripts/cordis-hmr-adapter.js /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/cordis-plugin-hmr/lib/index.js
          fi

          # Install ripgrep linux-arm64 specifically for android-arm64 execution
          npm install --prefix /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh @vscode/ripgrep-linux-arm64@1.18.0 --no-audit --no-fund || true

          # Safe Android Sandbox, Hardlink, Shell & Ripgrep Patch
          node $GITHUB_WORKSPACE/.github/scripts/patch-sandbox.js

          rm -rf /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/prebuilds/win32* || true
          rm -rf /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/prebuilds/darwin* || true
          rm -rf /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/node-pty/prebuilds/linux-x64* || true
          rm -rf /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/@img/sharp-libvips-linux-x64 || true
          rm -rf /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/@koromix/koffi-linux-x64 || true
          rm -rf /tmp/global_dsh/lib/node_modules/@deepseek-ai/dsh/node_modules/koffi/build/koffi/linux_x64 || true

          find /tmp/global_dsh -type f \( -name "*.d.ts" -o -name "*.map" -o -name "*.md" -o -name "LICENSE*" -o -name "CHANGELOG*" \) -delete || true
          find /tmp/global_dsh -type d \( -name "test" -o -name "tests" -o -name "docs" -o -name "example" -o -name "examples" \) -prune -exec rm -rf {} + || true
          
          tar -czf $GITHUB_WORKSPACE/app/src/main/assets/engine/dsh-core.tar.gz -C /tmp/global_dsh/lib/node_modules/@deepseek-ai dsh
          
          echo "=== ASSETS IN WORKSPACE ENGINE ==="
          ls -lh $GITHUB_WORKSPACE/app/src/main/assets/engine/

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-build-cache --stacktrace

      - name: Check APK contents and Compress ZIP
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cd app/build/outputs/apk/debug/
          zip -9 dsh-mobile-compressed.zip app-debug.apk
          ls -lh dsh-mobile-compressed.zip

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.2
          name: "DSH Mobile v1.7.2 (Direct Native Android Intent for Settings Config Opener)"
          body: |
            ## 🚀 DSH Mobile Standalone Release v1.7.2
            - ⚙️ **Fix "Open Configuration File" (Could not open configuration file)**:
              - Penanganan klik tombol buka file konfigurasi di settings sekarang langsung mengembalikan status sukses dan memicu Android Intent (`am start -a android.intent.action.VIEW`) untuk membuka file teks konfigurasi langsung di text editor/viewer HP.
            - 🛠️ **Fix `tools.code` Scope (Require / FS / Path / Process Globals)**
            - 🐚 **Fix `tools.bash` (Clean Module Import)**
            - 🐧 **Full Embedded PRoot + Alpine Linux Environment (`apk add`)**
            - 👑 **Supercharged Dual-Mode Superuser (Root `su`)**
            - 🛡️ **Full Android Permissions & Direct `/sdcard` Workspace**
            - 🗜️ **Tersedia Versi ZIP Hemat Kuota**: `dsh-mobile-compressed.zip`
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/dsh-mobile-compressed.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
